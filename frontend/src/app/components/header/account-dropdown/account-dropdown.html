@if (currentUser() == undefined || currentUser() == null) {
  <div class="flex w-full justify-center gap-2 md:justify-start">
    <a
      routerLink="/login"
      class="px-2 py-1 text-lg text-gray-700 transition-colors duration-200 hover:text-gray-950"
    >
      Login
    </a>
    <svg lucideLogIn size="20" class="self-center"></svg>
  </div>
} @else {
  <div class="relative">
    <button
      class="flex w-full justify-center gap-2 md:justify-start"
      (click)="toggle()"
    >
      <p
        class="px-2 py-1 text-lg text-gray-700 transition-colors duration-200 hover:text-gray-950"
      >
        {{ currentUser()?.username }}
      </p>
      <svg lucideUser size="20" class="self-center"></svg>
    </button>
    @if (isOpen()) {
      <div class="z-500 border bg-white md:absolute md:right-0">
        <a
          routerLink="/login"
          class="block px-2 py-1 text-center text-lg text-gray-700 transition-colors duration-200 hover:text-gray-950 md:text-right"
          (click)="logout()"
          >Logout</a
        >
      </div>
    }
  </div>
}
