<div class="flex items-center gap-1">
  <ng-content select="[label]"></ng-content>
  @if (label() != "") {
    <span [ngClass]="labelClasses()">{{ Label }}</span>
  }
  <ng-content select="[value]"></ng-content>
  @if (value() != "") {
    <span [ngClass]="valueClasses()">{{ ValueWithMetric }}</span>
  }
</div>
