<div class="w-full flex flex-col border border-gray-400 rounded p-2">
  <div class="flex justify-between items-center">
    <div class="flex items-center gap-2">
      <a
        [routerLink]="['/tours', tourLog()!.tourId, 'logs', tourLog()!.id]"
        class="text-gray-500 hover:text-gray-800 transition-colors duration-300"
      >
        <svg lucideSquarePen size="20"></svg>
      </a>
      <span class="text-gray-500 centered-text">{{
        tourLog().date | date: "short"
      }}</span>
    </div>
    <app-star-rating [rating]="tourLog().rating"></app-star-rating>
  </div>
  <p class="max-h-24 overflow-y-auto">{{ tourLog().comment }}</p>
  <div class="flex justify-between items-center text-sm md:text-base">
    <app-duration [duration]="durationInHours()"></app-duration>
    <app-distance [distance]="distanceInKm()"></app-distance>
    <app-label-value-set
      [label]="'Difficulty'"
      [value]="tourLog().difficulty"
    ></app-label-value-set>
  </div>
</div>
