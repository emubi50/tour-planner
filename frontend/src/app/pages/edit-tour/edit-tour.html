<form class="flex flex-col items-center align-middle">
  <h1 class="font-bold text-2xl text-gray-700 my-8">Edit tour</h1>
  <div class="flex flex-col w-full md:w-3/5 bg-red-300/10 gap-4 p-2">
    <input
      type="text"
      name="name"
      placeholder="Tour name"
      class="font-semibold lg:text-xl 2xl:text-2xl text-gray-700 bg-transparent border-b border-gray-300 focus:outline-none focus:border-gray-500 placeholder-gray-400"
    />
    <textarea
      name="description"
      placeholder="Tour description"
      rows="4"
      class="text-gray-500 lg:text-lg 2xl:text-xl bg-transparent border border-gray-300 rounded p-1 focus:outline-none focus:border-gray-500 placeholder-gray-400 resize-none"
    ></textarea>
  </div>

  <div class="flex flex-col gap-2 w-full md:w-3/5 bg-cyan-700/10 p-2">
    <div class="flex items-center justify-between">
      <div class="flex gap-2 items-center">
        <img
          src="https://www.iconpacks.net/icons/1/free-bicycle-icon-1054-thumb.png"
          alt="Tour Image"
          class="w-8 h-8 object-cover rounded"
        />
        <select
          name="transportType"
          class="bg-transparent border-b border-gray-300 focus:outline-none focus:border-gray-500 text-gray-700"
        >
          <option value="">Transport type</option>
          <option value="bicycle">Bicycle</option>
          <option value="walking">Walking</option>
          <option value="car">Car</option>
          <option value="public">Public transport</option>
        </select>
      </div>

      <div
        id="duration-and-distance"
        class="flex items-center gap-1 text-sm md:text-base"
      >
        <p>
          Duration: 4:00 h
          <span> | </span>
          Distance: 12.00 km
        </p>
        <!--values would be calculated by an external api-->
      </div>
    </div>

    <input
      type="text"
      name="tags"
      placeholder="Tags (comma-separated)"
      class="text-sm text-gray-700 bg-transparent border-b border-gray-300 focus:outline-none focus:border-gray-500 placeholder-gray-400"
    />

    <div
      class="flex flex-col gap-2 text-sm md:text-base w-full overflow-hidden"
    >
      <input
        type="text"
        name="start"
        placeholder="Start location"
        class="w-full bg-transparent border-b border-gray-300 focus:outline-none focus:border-gray-500 text-gray-700 placeholder-gray-400"
      />
      <input
        type="text"
        name="end"
        placeholder="End location"
        class="w-full bg-transparent border-b border-gray-300 focus:outline-none focus:border-gray-500 text-gray-700 placeholder-gray-400"
      />
    </div>

    <button
      type="submit"
      class="mt-2 w-full bg-cyan-700 hover:bg-cyan-800 text-white text-sm font-semibold py-2 px-4 rounded transition-colors"
    >
      Save Tour
    </button>
  </div>
</form>
