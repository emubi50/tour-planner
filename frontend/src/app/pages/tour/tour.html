<div class="flex h-full w-full">
  <app-tour-list [onClickFn]="setTourFn" class="w-full md:w-120" />
  @if (selectedTour() != null) {
    <div class="flex flex-col w-full p-4">
      <div id="map-container" class="w-full h-120 mb-4 mx-auto bg-amber-200">
        <img
          src="https://img.freepik.com/free-vector/black-white-town-navigation-map_23-2148309836.jpg"
          alt="Tour image"
          class="max-w-full max-h-full mx-auto"
        />
      </div>
      <div class="flex">
        <div class="flex flex-col w-2/3 bg-red-300 gap-4">
          <h1 class="font-semibold text-2xl text-gray-700">
            {{ tour()?.name }}
          </h1>
          <p class="text-gray-500 text-xl">{{ tour()?.description }}</p>
        </div>
        <div class="flex w-1/3 bg-cyan-700"></div>
      </div>
    </div>
  } @else {
    <p>No tour is selected</p>
  }
</div>
