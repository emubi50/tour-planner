<form
  [formGroup]="loginForm"
  (ngSubmit)="onSubmit()"
  class="flex flex-col items-center align-middle"
>
  <h1 class="font-bold text-2xl text-gray-700 my-8">Login</h1>
  <div class="flex flex-col w-full md:w-3/5 bg-red-300/10 gap-4 p-2">
    <input
      type="text"
      name="name"
      formControlName="username"
      placeholder="Username"
      [class]="
        username?.touched && username?.invalid
          ? 'border-red-500'
          : 'border-gray-300'
        "
      class="font-semibold lg:text-xl 2xl:text-2xl text-gray-700 bg-transparent border-b focus:outline-none focus:border-gray-500 placeholder-gray-400"
    />
  </div>

  <div class="flex flex-col gap-2 w-full md:w-3/5 bg-cyan-700/10 p-2">
    <input
      type="password"
      name="password"
      formControlName="password"
      placeholder="Password"
      [class]="
        password?.touched && password?.invalid
          ? 'border-red-500'
          : 'border-gray-300'
        "
      class="font-semibold lg:text-xl 2xl:text-2xl text-gray-700 bg-transparent border-b focus:outline-none focus:border-gray-500 placeholder-gray-400"
    />
  </div>

  <button
    type="submit"
    [disabled]="!loginForm.valid"
    class="mt-2 w-3/5 bg-cyan-700 disabled:bg-gray-500 disabled:cursor-not-allowed hover:bg-cyan-800 text-white text-sm font-semibold py-2 px-4 rounded transition-colors"
  >
    Sign in
  </button>

  <p class="flex flex-row justify-center gap-2">
    Don't have an account yet?
    <a routerLink="/registration" class="text-cyan-700 hover:text-cyan-900"
      >Register here!</a
    >
  </p>
</form>
