services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: "TourPlannerApi"
      Jwt__Audience: "TourPlanner"
      ConnectionStrings__DBConn: "Host=db;Port=5432;Database=tour-planner;Username=postgres;Password=${DB_PASSWORD}"
      OpenRouteService__ApiKey: ${ORS_API_KEY}

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tour-planner

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tour-planner"]
      interval: 5s
      timeout: 30s
      retries: 5
